services:
  - type: web
    name: jobportal
    # The image is built, smoke-tested and published by GitHub Actions, so Render
    # only pulls it. That removes Render's build step and guarantees the image that
    # was tested is the image that runs.
    runtime: image
    image:
      url: ghcr.io/somilgarg1807/jobportal:latest
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: REMEMBER_ME_KEY
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: jobportal-cache
          property: connectionString
  - type: keyvalue
    name: jobportal-cache
    plan: free
    region: singapore
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
