name: CI/CD

# CI runs on every push to main and on every pull request.
# Deploy only happens after CI is green, and only for main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # One run at a time per branch; a newer push queues instead of killing the running one.
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build and run tests
        run: ./mvnw -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: jobportal-jar
          path: target/*.jar

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (same Dockerfile Render uses)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: jobportal:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container starts
        run: |
          docker run -d --name jobportal-ci -p 8080:8080 \
            -e LOCAL_DB_URL='jdbc:h2:mem:smoke;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE' \
            -e DB_USERNAME=sa -e DB_PASSWORD= \
            -e SPRING_JPA_HIBERNATE_DDL_AUTO=create-drop \
            -e SPRING_SQL_INIT_MODE=never \
            -e SPRING_CACHE_TYPE=none \
            jobportal:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health > /dev/null; then
              echo "container healthy"; exit 0
            fi
            sleep 5
          done
          echo "container never became healthy"; docker logs jobportal-ci; exit 1

      - name: Container logs
        if: always()
        run: docker logs jobportal-ci || true

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [test, docker]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production
    steps:
      - name: Trigger Render deploy
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
