name: CI/CD

# CI runs on every push to main and on every pull request.
# Deploy only happens after CI is green, and only for main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # One run at a time per branch; a newer push queues instead of killing the running one.
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build and run tests
        run: ./mvnw -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: jobportal-jar
          path: target/*.jar

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: test
    # H2 is test-scoped, so it is not in the runtime jar. The smoke test below runs
    # against MySQL, which ships in the image and is what TiDB speaks in production.
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: jobportal
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (same Dockerfile Render uses)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: jobportal:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container starts
        env:
          # --network host lets the container reach the MySQL service on the runner's localhost.
          DB_URL: jdbc:mysql://127.0.0.1:3306/jobportal?allowPublicKeyRetrieval=true&useSSL=false
        run: |
          docker run -d --name jobportal-ci --network host -e DB_URL="$DB_URL" -e DB_USERNAME=root -e DB_PASSWORD=root -e SPRING_CACHE_TYPE=none jobportal:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health > /dev/null; then
              echo "container healthy"
              exit 0
            fi
            if [ -z "$(docker ps -q -f name=jobportal-ci)" ]; then
              echo "container exited early"
              docker logs jobportal-ci
              exit 1
            fi
            sleep 5
          done
          echo "container never became healthy"
          docker logs jobportal-ci
          exit 1

      - name: Container logs
        if: always()
        run: docker logs jobportal-ci || true

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [test, docker]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production
    steps:
      - name: Trigger Render deploy
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
