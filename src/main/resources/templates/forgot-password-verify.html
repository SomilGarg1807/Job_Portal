<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset code | HotDevJobs</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/assets/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/verify-email.css}">
</head>
<body>
<main class="verification-card">
    <a class="brand" th:href="@{/}">hotdevjobs<span>.com</span></a>
    <div class="email-mark" aria-hidden="true">✉</div>
    <h1>Check your inbox</h1>
    <p>If an account exists for that email, we sent a six-digit reset code. It expires in 10 minutes.</p>
    <p class="error" role="alert" th:if="${error}" th:text="${error}"></p>
    <p class="notice" role="status" th:if="${message}" th:text="${message}"></p>
    <form th:action="@{/forgot-password/verify}" method="post">
        <label for="code">Reset code</label>
        <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" placeholder="000000" required autofocus>
        <button class="primary" type="submit">Continue</button>
    </form>
    <form th:action="@{/forgot-password/resend}" method="post">
        <button class="secondary" type="submit">Send a new code</button>
    </form>
    <p class="hint">Check your spam folder. Please wait 60 seconds between requests.</p>
    <a th:href="@{/forgot-password}">Use a different email</a>
</main>
</body>
</html>
