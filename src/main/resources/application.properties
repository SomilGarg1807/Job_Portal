spring.application.name=jobportal
spring.config.import=optional:file:./application-secrets.properties
spring.datasource.url=${DB_URL:${LOCAL_DB_URL}}
spring.datasource.username=${DB_USERNAME:${LOCAL_DB_USERNAME}}
spring.datasource.password=${DB_PASSWORD:${LOCAL_DB_PASSWORD}}
server.port=${PORT:8080}
server.address=0.0.0.0
server.forward-headers-strategy=framework
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never
spring.cache.type=${CACHE_TYPE:redis}
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=12MB
