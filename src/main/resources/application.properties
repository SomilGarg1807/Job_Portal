spring.application.name=jobportal
spring.config.import=optional:file:./application-secrets.properties,optional:file:./application-local.properties
spring.datasource.url=${DB_URL:${LOCAL_DB_URL}}
spring.datasource.username=${DB_USERNAME:${LOCAL_DB_USERNAME}}
spring.datasource.password=${DB_PASSWORD:${LOCAL_DB_PASSWORD}}
server.port=${PORT:8080}
server.address=0.0.0.0
server.forward-headers-strategy=framework
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never
spring.cache.type=${CACHE_TYPE:redis}
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=12MB
# TiDB Cloud public endpoints drop connections idle for 340s; ping and recycle pooled connections sooner
# so the first request after a quiet period does not stall on a dead connection.
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.maximum-pool-size=5
# Signs 7-day remember-me cookies; set a long random value so logins survive deploys.
app.remember-me.key=${REMEMBER_ME_KEY:}

# Semantic matching (see src/main/java/com/somil/jobportal/ai/README.md). Off unless AI_EMBEDDING_ENABLED=true.
app.ai.embedding.enabled=${AI_EMBEDDING_ENABLED:false}
app.ai.embedding.api-key=${GEMINI_API_KEY:}
app.ai.embedding.model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
app.ai.embedding.dimensions=${GEMINI_EMBEDDING_DIMENSIONS:768}
app.ai.embedding.batch-size=${AI_EMBEDDING_BATCH_SIZE:50}
app.ai.embedding.max-retries=${AI_EMBEDDING_MAX_RETRIES:5}
app.ai.embedding.initial-backoff=${AI_EMBEDDING_BACKOFF_MS:2000}ms
app.ai.embedding.job-strategies=${AI_JOB_STRATEGIES:job_full_v1,job_req_v1}
app.ai.embedding.candidate-strategies=${AI_CANDIDATE_STRATEGIES:cand_profile_v1}
