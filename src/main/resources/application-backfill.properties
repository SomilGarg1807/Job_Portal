# Profile for the embedding backfill CLI: no web server, no Redis, embedding switched on.
# Run from the project folder, e.g.
#   .\mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=backfill" "-Dspring-boot.run.arguments=--ai.backfill.dry-run=true"
spring.main.web-application-type=none
spring.cache.type=none
app.ai.embedding.enabled=true
